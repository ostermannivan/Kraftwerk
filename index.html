<html lang="de">
<head>
<meta charset="utf-8">

<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1320x2868.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1284x2778.png">
<link rel="apple-touch-startup-image" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1080x2340.png">

<title>Kraftwerk</title>
<style>
:root{
  --bg:#0A0B0D; --s1:#121418; --s2:#181B20; --s3:#1F232A; --line:#272B32;
  --gold:#C9A45C; --gold2:#E4CB8F; --text:#ECE6D8; --muted:#8A8D94; --silver:#B9BDC4;
  --bronze:#B07A57; --steel:#7F9CB8; --sage:#93BE9A; --inbg:#17140F; --inline:#4E4027;
  --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0A0B0D; --text:#ECE6D8; } }
:root[data-theme="dark"]{ --bg:#0A0B0D; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:inherit; -webkit-tap-highlight-color:transparent; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.4;
  overscroll-behavior-y:none; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
input,textarea,select{ font:inherit; color:var(--gold2); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.wrap{ max-width:560px; margin:0 auto; padding:0 16px 150px; }

/* Kopf */
header.top{ padding:14px 0 6px; }
.brand{ display:flex; justify-content:space-between; align-items:baseline; }
.brand h1{ font-family:var(--serif); font-weight:400; font-size:15px; letter-spacing:.14em; color:var(--gold); margin:0; }
.brand .today{ font-size:13px; color:var(--muted); }
.weekhead{ margin-top:10px; }
.weekhead h2{ font-family:var(--serif); font-weight:400; font-size:40px; line-height:1.05; margin:0; color:var(--text); }
.weekhead h2 .dl{ color:var(--steel); }
.weekhead .sub{ color:var(--muted); font-size:14px; margin-top:4px; }
.params{ display:flex; gap:18px; margin-top:12px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); overflow-x:auto; }
.params div{ flex:0 0 auto; }
.params b{ display:block; font-family:var(--serif); font-weight:400; font-size:20px; color:var(--gold2); }
.params span{ font-size:12px; color:var(--muted); }

/* Wochenleiste */
.weeks{ display:flex; gap:6px; overflow-x:auto; padding:14px 2px 10px; scrollbar-width:none; }
.weeks::-webkit-scrollbar{ display:none; }
.wk{ flex:0 0 40px; height:48px; border-radius:10px; background:var(--s1); display:flex; flex-direction:column;
  align-items:center; justify-content:center; font-size:15px; color:var(--silver); position:relative; border:1px solid transparent; }
.wk i{ position:absolute; bottom:6px; width:14px; height:2px; border-radius:1px; background:var(--c); }
.wk.done{ color:var(--sage); }
.wk.sel{ border-color:var(--gold); color:var(--text); background:var(--s2); }
.wk.now::after{ content:""; position:absolute; top:5px; width:4px; height:4px; border-radius:50%; background:var(--gold); }

/* Tage */
.days{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:4px 0 18px; }
.day{ background:var(--s1); border-radius:12px; padding:9px 4px 8px; text-align:center; border:1px solid transparent; }
.day b{ display:block; font-size:14px; font-weight:600; }
.day span{ font-size:12px; color:var(--muted); }
.day.sel{ border-color:var(--gold); background:var(--s2); }
.day.done span{ color:var(--sage); }

/* Übungen */
.ex{ padding:16px 0 18px; border-top:1px solid var(--line); }
.ex.main{ border-top:1px solid var(--gold); }
.exhead{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.kind{ font-size:12px; color:var(--gold); letter-spacing:.02em; }
.ex:not(.main) .kind{ color:var(--muted); }
.exname{ font-size:18px; font-weight:600; margin-top:2px; }
.exmeta{ font-size:13px; color:var(--muted); margin-top:3px; }
.exmeta em{ font-style:normal; color:var(--silver); }
.tools{ display:flex; gap:6px; flex:0 0 auto; }
.tbtn{ width:34px; height:34px; border-radius:10px; background:var(--s1); color:var(--silver); display:flex; align-items:center; justify-content:center; font-size:15px; }
.hint{ font-size:13px; color:var(--silver); background:var(--s1); border-left:2px solid var(--gold); padding:8px 10px; margin-top:10px; border-radius:0 8px 8px 0; }

.target{ display:flex; align-items:baseline; gap:12px; margin:12px 0 4px; }
.big{ font-family:var(--serif); font-size:52px; line-height:1; color:var(--gold2); font-variant-numeric:lining-nums tabular-nums; }
.big small{ font-size:20px; color:var(--gold); margin-left:4px; }
.target .rx{ font-size:15px; color:var(--silver); }
.target .rx b{ color:var(--text); font-weight:600; }
.last{ font-size:13px; color:var(--muted); margin:8px 0 2px; }
.last b{ color:var(--silver); font-weight:500; }

.sets{ margin-top:10px; display:grid; gap:6px; }
.set{ display:grid; grid-template-columns:28px 1fr 1fr var(--rircol,0px) 48px; gap:6px; align-items:center; }
.set.hasrir{ --rircol:1fr; }
.set .no{ font-size:13px; color:var(--muted); text-align:center; }
.fld{ position:relative; }
.fld input{ width:100%; height:46px; border-radius:10px; border:1px solid var(--inline); background:var(--inbg); padding:14px 8px 2px;
  text-align:center; font-size:18px; font-weight:600; -webkit-appearance:none; appearance:none; }
.fld input::placeholder{ color:#6E5E3F; font-weight:500; }
.fld label{ position:absolute; top:4px; left:0; right:0; text-align:center; font-size:10px; color:var(--muted); pointer-events:none; }
.chk{ height:46px; border-radius:10px; border:1px solid var(--line); background:var(--s1); color:var(--muted); font-size:20px; }
.set.ok .chk{ background:#1B2A20; border-color:#2F4A37; color:var(--sage); }
.set.ok .fld input{ border-color:#2F4A37; background:#121A15; color:#BFE0C4; }
.e1{ font-size:13px; color:var(--muted); margin-top:8px; }
.e1 b{ color:var(--gold2); font-family:var(--serif); font-size:17px; font-weight:400; }
.e1 .pr{ color:var(--sage); }
.note textarea{ width:100%; min-height:80px; border-radius:12px; border:1px solid var(--inline); background:var(--inbg); padding:10px 12px; font-size:15px; }
.note h3, .card h3, .sec h3{ font-family:var(--serif); font-weight:400; font-size:22px; margin:0 0 10px; color:var(--text); }

/* Karten & Listen */
.sec{ margin-top:22px; }
.row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); gap:12px; }
.row .l{ font-size:15px; }
.row .l small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
.row .r{ text-align:right; }
.row .r b{ font-family:var(--serif); font-weight:400; font-size:24px; color:var(--gold2); }
.row .r small{ display:block; font-size:12px; color:var(--muted); }
.gain{ color:var(--sage); } .neg{ color:var(--bronze); }
.muted{ color:var(--muted); }
.lead{ color:var(--muted); font-size:14px; margin:0 0 10px; }
.chart{ width:100%; height:auto; display:block; margin-top:8px; }
.legend{ display:flex; gap:16px; font-size:13px; color:var(--silver); margin-top:6px; }
.legend i{ display:inline-block; width:14px; height:2px; vertical-align:middle; margin-right:6px; }

.form .frow{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.form .frow span{ font-size:15px; }
.form .frow small{ display:block; font-size:12px; color:var(--muted); }
.form input, .form select{ width:128px; height:42px; border-radius:10px; border:1px solid var(--inline); background:var(--inbg); padding:0 10px; text-align:right; font-size:16px; -webkit-appearance:none; }
.form select{ width:190px; text-align:left; }
.form input[type=date]{ width:150px; }
.btn{ display:block; width:100%; height:48px; border-radius:12px; background:var(--s2); border:1px solid var(--line); color:var(--text); font-size:16px; margin-top:10px; }
.btn.gold{ background:var(--gold); color:#16120A; border-color:var(--gold); font-weight:600; }
.btn.danger{ color:#D98C7A; }
.toggle{ width:52px; height:32px; border-radius:16px; background:var(--s3); position:relative; flex:0 0 auto; }
.toggle::after{ content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:var(--silver); transition:left .2s; }
.toggle.on{ background:var(--gold); }
.toggle.on::after{ left:23px; background:#16120A; }

/* Timer */
.timer{ position:fixed; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom,0px)); z-index:20; display:none; }
.timer.show{ display:block; }
.timer .in{ max-width:560px; margin:0 auto; background:#17140F; border-top:1px solid var(--gold); padding:10px 16px; display:flex; align-items:center; gap:12px; }
.timer .t{ font-family:var(--serif); font-size:30px; color:var(--gold2); font-variant-numeric:tabular-nums; min-width:92px; }
.timer .lbl{ flex:1; font-size:13px; color:var(--muted); }
.timer .bar{ height:2px; background:var(--gold); position:absolute; left:0; top:0; }
.timer button{ height:38px; padding:0 12px; border-radius:10px; background:var(--s2); font-size:14px; }
.timer.end .in{ background:#1B2A20; border-top-color:var(--sage); }
.timer.end .t{ color:var(--sage); }

/* Tabs */
nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(10,11,13,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
nav.tabs .in{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); height:64px; }
nav.tabs button{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--muted); }
nav.tabs button svg{ width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.6; }
nav.tabs button.sel{ color:var(--gold); }

/* Bottom-Sheet */
.sheetbg{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40; display:none; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--s1); border-radius:18px 18px 0 0; max-height:82vh; overflow-y:auto;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px)); transform:translateY(100%); transition:transform .25s ease; }
.sheet.show{ transform:none; }
.sheetbg.show{ display:block; }
.sheet .grab{ width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 12px; }
.sheet h3{ font-family:var(--serif); font-weight:400; font-size:24px; margin:0; }
.sheet p{ color:var(--muted); font-size:14px; margin:4px 0 12px; }
.opt{ display:flex; justify-content:space-between; align-items:center; width:100%; padding:13px 2px; border-bottom:1px solid var(--line); text-align:left; }
.opt .n{ font-size:16px; }
.opt .o{ font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:2px 6px; flex:0 0 auto; }
.opt.cur .n{ color:var(--gold2); }
.addrow{ display:flex; gap:8px; margin-top:14px; }
.addrow input{ flex:1; height:44px; border-radius:10px; border:1px solid var(--inline); background:var(--inbg); padding:0 12px; font-size:16px; }
.addrow button{ height:44px; padding:0 14px; border-radius:10px; background:var(--gold); color:#16120A; font-weight:600; }
.toast{ position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--s3); color:var(--text);
  padding:10px 16px; border-radius:12px; font-size:14px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.show{ opacity:1; }
.day.optx{ border:1px dashed var(--line); background:transparent; }
.day.optx b{ color:var(--silver); font-weight:500; }
.small{ font-size:13px; }
.formsec{ margin:2px 0 6px; }
.formhead{ display:flex; justify-content:space-between; align-items:baseline; }
.formhead span{ font-size:15px; } .formhead small{ font-size:12px; color:var(--muted); }
.scale{ display:grid; grid-template-columns:repeat(5,1fr); margin-top:8px; border:1px solid var(--line); border-radius:12px; overflow:hidden;
  background:linear-gradient(90deg,#2A1D18 0%,#1A1B1F 45%,#1A1B1F 55%,#1B2A20 100%); }
.sc{ padding:8px 0 7px; display:flex; flex-direction:column; align-items:center; gap:2px; border-right:1px solid var(--line); }
.sc:last-child{ border-right:0; }
.sc b{ font-family:var(--serif); font-weight:400; font-size:20px; color:var(--text); }
.sc span{ font-size:11px; color:var(--muted); }
.sc.on{ background:var(--gold); } .sc.on b,.sc.on span{ color:#16120A; }
.sc.on.low{ background:var(--bronze); }
.formtxt{ margin-top:8px; } .formtxt b{ color:var(--text); font-weight:600; }
.chips{ display:flex; gap:6px; }
.chips.cwrap{ flex-wrap:wrap; }
.chip{ min-width:40px; height:36px; padding:0 12px; border-radius:18px; background:var(--s1); border:1px solid var(--line); color:var(--silver); font-size:14px; }
.chip.on{ background:var(--gold); border-color:var(--gold); color:#16120A; font-weight:600; }
.fb{ background:var(--s1); border:1px solid var(--steel); border-radius:14px; padding:14px; margin-bottom:18px; }
.fb h3{ font-family:var(--serif); font-weight:400; font-size:22px; margin:0 0 4px; }
.fbq{ margin:12px 0; } .fbq>span{ display:block; font-size:14px; color:var(--silver); margin-bottom:6px; }
.fbres{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:15px; color:var(--gold2); }
.frow2{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:15px; }
.warm{ font-size:13px; color:var(--muted); margin:6px 0 2px; }
.ex.ss{ border-left:2px solid var(--gold); padding-left:12px; margin-left:-14px; }
.setsel{ display:flex; gap:6px; margin:6px 0 14px; }

/* Start-Animation */
#splash{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  animation:splashOut .5s ease 2.7s forwards; }
#splash .claim2{ font-size:13px; color:var(--silver); opacity:0; animation:fadeIn .6s ease 1.6s forwards; }
#splash .word{ font-family:var(--serif); font-size:28px; letter-spacing:.38em; color:var(--gold); padding-left:.38em; display:flex; }
#splash .word span{ opacity:0; transform:translateY(8px); animation:letterIn .5s cubic-bezier(.2,.7,.2,1) forwards; }
#splash .rule{ height:1px; width:0; background:var(--gold); animation:ruleIn .7s ease .45s forwards; }
#splash .claim{ font-family:var(--serif); font-size:20px; color:var(--text); opacity:0; animation:fadeIn .7s ease 1.05s forwards; margin-top:10px; }
@keyframes letterIn{ to{ opacity:1; transform:none; } }
@keyframes ruleIn{ to{ width:150px; } }
@keyframes fadeIn{ to{ opacity:1; } }
@keyframes splashOut{ to{ opacity:0; visibility:hidden; } }
/* Seitenwechsel */
#app.enter{ animation:enter .32s cubic-bezier(.2,.7,.2,1); }
@keyframes enter{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
/* Satz abgehakt */
.set.pop .chk{ animation:pop .42s cubic-bezier(.3,1.6,.5,1); }
.set.pop .fld input{ animation:okflash .6s ease; }
@keyframes pop{ 0%{ transform:scale(.7); } 60%{ transform:scale(1.12); } 100%{ transform:scale(1); } }
@keyframes okflash{ from{ box-shadow:0 0 0 0 rgba(147,190,154,.45); } to{ box-shadow:0 0 0 8px rgba(147,190,154,0); } }
/* Pausenende */
.timer.end .in{ animation:pulse 1.2s ease-in-out 3; }
@keyframes pulse{ 0%,100%{ background:#1B2A20; } 50%{ background:#2A4432; } }
/* Rekord-Moment */
#pr{ position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; pointer-events:none; }
#pr.show{ display:flex; }
#pr .card{ text-align:center; padding:26px 30px; border-radius:18px; background:radial-gradient(circle at 50% 30%,#2A2212,#0E0D0B 70%); border:1px solid var(--gold);
  box-shadow:0 0 60px rgba(201,164,92,.35); animation:prIn .5s cubic-bezier(.2,1.4,.4,1), prOut .5s ease 2.1s forwards; }
#pr .t1{ font-size:13px; color:var(--gold); letter-spacing:.2em; }
#pr .t2{ font-family:var(--serif); font-size:54px; color:var(--gold2); line-height:1.1; margin-top:6px;
  background:linear-gradient(100deg,#C9A45C 20%,#FFF1CC 45%,#C9A45C 70%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 1.6s ease .3s; }
#pr .t3{ font-size:14px; color:var(--silver); margin-top:4px; }
@keyframes prIn{ from{ opacity:0; transform:scale(.85); } to{ opacity:1; transform:none; } }
@keyframes prOut{ to{ opacity:0; transform:scale(.96); } }
@keyframes shine{ from{ background-position:100% 0; } to{ background-position:0 0; } }
.splitbtn,.optbtn{ display:block; width:100%; margin:10px 0 4px; padding:11px 12px; border-radius:12px; border:1px dashed var(--line); color:var(--silver); font-size:14px; text-align:center; }
.splitbtn.on{ border-style:solid; border-color:var(--gold); color:var(--gold2); }
.optbtn{ margin:14px 0; } .optbtn.on{ color:var(--muted); }
.startbtn{ height:54px; font-size:17px; margin:6px 0 14px; }
.sessrow{ display:flex; justify-content:space-between; align-items:center; background:var(--s1); border:1px solid var(--gold); border-radius:14px; padding:10px 14px; margin:6px 0 14px; }
.sessrow.done{ border-color:#2F4A37; }
.sessrow .small{ display:block; font-size:12px; } .clock{ font-family:var(--serif); font-weight:400; font-size:26px; color:var(--gold2); font-variant-numeric:tabular-nums; }
.sessbtns{ display:flex; gap:6px; }
#focus{ position:fixed; inset:0; z-index:55; background:var(--bg); display:none; flex-direction:column; overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 90px); }
#focus.show{ display:flex; animation:enter .25s ease; }
.fhead{ display:flex; justify-content:space-between; align-items:center; }
.fclose{ width:40px; height:40px; border-radius:12px; background:var(--s1); font-size:18px; color:var(--silver); }
.fprog{ height:3px; background:var(--s2); border-radius:2px; margin:12px 0 18px; } .fprog i{ display:block; height:100%; background:var(--gold); border-radius:2px; transition:width .3s; }
.fname{ font-family:var(--serif); font-size:30px; line-height:1.15; margin:4px 0 6px; }
.fset{ color:var(--silver); font-size:15px; }
.fbig{ font-family:var(--serif); font-size:78px; line-height:1; color:var(--gold2); margin:16px 0 4px; font-variant-numeric:tabular-nums; }
.fbig small{ font-size:26px; color:var(--gold); }
.frx{ font-size:17px; color:var(--text); }
.finputs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 14px; } .finputs.r3{ grid-template-columns:1fr 1fr 1fr; }
.finputs .fld input{ height:64px; font-size:24px; padding-top:18px; }
.fok{ height:64px; font-size:19px; }

function e1Text(slot,w,d){
  const r=rx(slot,w), L=getLog(w,d,slot.id); if(!L) return "";
  let best=null; L.sets.forEach((s,i)=>{ const e=setE1(s, slot.t?r.reps:parseInt(String(s.reps).split(/[\/·]/)[0]), slot.t?r.rir:accRir(i,L.sets.length,W(w))); if(e!=null&&(best==null||e>best)) best=e; });
  if(best==null) return slot.t==="TOP"?"Gewicht, Wdh. und RIR eintragen → Tages-e1RM und Backoffs passen sich an.":"";
  let pr=""; if(slot.t==="TOP"&&["kb","bd","kh"].includes(slot.lift)){ const prev=bestMain(slot.lift,w); if(prev==null||best>prev.e) pr=` <span class="pr">· neuer Rekord</span>`; }
  return `e1RM heute <b>${f1(best)} kg</b>${pr}`;
}

function bestMain(lift,excludeW){ let b=null; for(let w=1;w<=NW;w++){ if(w===excludeW||W(w).deload) continue; const e=topE1(lift,w); if(e!=null&&(!b||e>b.e)){ const [d,sid]=LIFTDAY[lift]; const s=getLog(w,d,sid).sets[0]; b={e,w,kg:num(s.kg),reps:num(s.reps)??W(w)[{bd:"bdt",kb:"kbt",kh:"kht"}[lift]],rir:num(s.rir)??W(w).top,date:st.dates[w+"|"+d]}; } } return b; }
function bestTracked(name){ let b=null, first=null;
  for(let w=1;w<=NW;w++){ if(W(w).deload) continue; const DX=daysFor(w); for(let d=0;d<DX.length;d++) for(const s of DX[d].slots){ if(s.t||exName(s,w)!==name) continue; const L=getLog(w,d,s.id); if(!L) continue; const r=rx(s,w);
    L.sets.forEach((z,i)=>{ const reps=num(z.reps)??parseInt(String(z.reps).split(/[\/·]/)[0]); const e=setE1(z,reps,accRir(i,L.sets.length,W(w))); if(e==null) return; if(first==null) first=e; if(!b||e>b.e) b={e,w,kg:num(z.kg),reps,rir:num(z.rir)??r.rir,date:st.dates[w+"|"+d]}; }); } }
  if(b) b.first=first; return b; }
function heaviest(){ const m={}; for(const k in st.log){ const [w,d,sid]=k.split("|").map((x,i)=>i<2?+x:x); const slot=slotFor(d,sid); if(!slot||slot.t) continue; const name=exName(slot,w);
  if(MAIN_NAMES.includes(name)) continue; st.log[k].sets.forEach(z=>{ const kg=num(z.kg); if(kg&&(!m[name]||kg>m[name].kg)) m[name]={kg,w,g:slot.g}; }); }
  return Object.entries(m).sort((a,b)=>a[1].g.localeCompare(b[1].g)); }
function bodyNow(){ for(let w=NW;w>=0;w--){ const v=num(st.body[w]); if(v) return v; } return null; }

function chartE1(){
  const series=[["kb","var(--gold)","Kniebeuge"],["bd","var(--silver)","Bankdrücken"],["kh","var(--bronze)","Kreuzheben"]];
  const pts={}; let min=Infinity,max=-Infinity;
  series.forEach(([k])=>{ let last=st.set[k]; pts[k]=[last]; for(let w=1;w<=NW;w++){ const e=W(w).deload?null:topE1(k,w); if(e!=null) last=e; pts[k].push(last); } pts[k].forEach(v=>{min=Math.min(min,v);max=Math.max(max,v);}); });
  min=Math.floor((min-5)/10)*10; max=Math.ceil((max+5)/10)*10;
  const Wd=340,Hd=180,px=30,py=12; const X=i=>px+i*(Wd-px-8)/NW, Y=v=>py+(Hd-2*py)*(1-(v-min)/(max-min||1));
  let g=`<svg class="chart" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="e1RM-Verlauf">`;
  for(let v=min;v<=max;v+=Math.max(10,Math.round((max-min)/40)*10)){ g+=`<line x1="${px}" x2="${Wd-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#262A31" stroke-width="1"/><text x="${px-4}" y="${Y(v)+4}" fill="#8A8D94" font-size="10" text-anchor="end">${v}</text>`; }
  [5,10].forEach(w=>{ g+=`<line x1="${X(w)}" x2="${X(w)}" y1="${py}" y2="${Hd-py}" stroke="#7F9CB8" stroke-opacity=".35" stroke-dasharray="3 3"/>`; });
  series.forEach(([k,c])=>{ g+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts[k].map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`; });
  g+=`<text x="${X(0)}" y="${Hd-1}" fill="#8A8D94" font-size="10">Start</text><text x="${X(NW)}" y="${Hd-1}" fill="#8A8D94" font-size="10" text-anchor="end">W${NW}</text></svg>`;
  return g+`<div class="legend">${series.map(([k,c,n])=>`<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>`;
}

  h+=`<div class="sec form">`;

    h+=`<div class="frow"><span>${w===0?"Start":"Woche "+w}<small>${dshort(weekDate(Math.max(1,w),w===0?0:6))}${dlt!=null?` · <span class="${dlt<=0?"":"gain"}">${(dlt>=0?"+":"")+f1(dlt)} kg</span>`:""}</small></span>

function chartBody(vals){ const Wd=340,Hd=140,px=30,py=12; let mn=Math.min(...vals.map(v=>v[1]))-1, mx=Math.max(...vals.map(v=>v[1]))+1;
  const X=i=>px+i*(Wd-px-8)/NW, Y=v=>py+(Hd-2*py)*(1-(v-mn)/(mx-mn));
  let g=`<svg class="chart" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Gewichtsverlauf">`;

function sessDate(w,d){ const s=st.sess[w+"|"+d]; const x=(s&&s.s)||st.dates[w+"|"+d]; return x?new Date(x):null; }
function sessionsAll(){ const out=[]; for(let w=1;w<=NW;w++){ const DX=daysFor(w); for(let d=0;d<DX.length;d++){ if(!started(w,d)) continue;
  const dt=sessDate(w,d), s=st.sess[w+"|"+d], dd=dayDone(w,d); out.push({w,d,tag:DX[d].pull?"Pull":DX[d].split?"Push":DX[d].tag,date:dt,dur:(s&&s.s&&s.e)?new Date(s.e)-new Date(s.s):null,ok:dd.ok,all:dd.all,done:dd.done}); } }
  return out.sort((a,b)=>(b.date||0)-(a.date||0)); }
function relDay(dt){ if(!dt) return "–"; const a=new Date(); a.setHours(0,0,0,0); const b=new Date(dt); b.setHours(0,0,0,0); const n=Math.round((a-b)/864e5);
  return n===0?"heute":n===1?"gestern":n<7?"vor "+n+" Tagen":b.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}); }
function vStatus(){ const all=sessionsAll(); const cw=currentWeek(); const done=[0,1,2].filter(d=>dayDone(cw,d).done).length; const last=all[0];
  return `<div class="status"><div><span>Zuletzt trainiert</span><b>${last?relDay(last.date)+" · "+esc(last.tag):"noch nie – los geht’s"}</b></div>
   <div class="r"><span>Woche ${cw}</span><b>${done} / 3</b></div></div>`; }
function weekStreak(){ const cw=currentWeek(); let n=0; for(let w=cw;w>=1;w--){ if(weekDone(w)) n++; else if(w===cw) continue; else break; } return n; }
function exStats(){ const m={}; for(const k in st.log){ const [w,d,sid]=k.split("|"); const slot=slotFor(+d,sid); if(!slot) continue; const name=exName(slot,+w); if(!name) continue;
    st.log[k].sets.forEach(z=>{ const kg=num(z.kg); if(!z.ok||kg==null) return; const e=m[name]||(m[name]={name,g:slot.g,weeks:{},best:0,n:0}); e.n++;
      const cur=e.weeks[w]; if(!cur||kg>cur.kg) e.weeks[w]={kg,reps:z.reps}; if(kg>e.best) e.best=kg; }); }
  return Object.values(m).sort((a,b)=>GROUPS.indexOf(a.g)-GROUPS.indexOf(b.g)||a.name.localeCompare(b.name)); }
function vProg(){
  const seg=ui.ptab||"over";
  let h=`<header class="top"><div class="brand"><h1>KRAFTWERK</h1></div><div class="weekhead"><h2>Fortschritt</h2></div></header>
   <div class="seg">${[["over","Übersicht"],["ex","Übungen"],["hist","Verlauf"]].map(([k,l])=>`<button class="${seg===k?"on":""}" data-ptab="${k}">${l}</button>`).join("")}</div>`;
  if(seg==="ex") return h+vExList();
  if(seg==="hist") return h+vHistory();
  const all=sessionsAll(); const tot=all.reduce((a,s)=>a+(s.dur||0),0); const cw=currentWeek();
  h+=`<div class="stats"><div><b>${weekStreak()}</b><span>Wochen-Serie</span></div><div><b>${all.length}</b><span>Einheiten</span></div><div><b>${tot?(Math.round(tot/36e5*10)/10).toLocaleString("de-DE"):"–"}</b><span>Stunden</span></div></div>`;
  const per=[...Array(NW)].map((_,i)=>all.filter(s=>s.w===i+1).length); const mx=Math.max(4,...per);
  h+=`<div class="sec"><h3>Konstanz</h3><p class="lead small">Einheiten pro Woche · Ø ${(per.slice(0,cw).reduce((a,b)=>a+b,0)/cw).toLocaleString("de-DE",{maximumFractionDigits:1})}</p>
   <div class="bars">${per.map((n,i)=>`<div class="bar ${i+1===cw?"now":""} ${W(i+1).deload?"dl":""}"><i style="height:${n/mx*100}%"></i><b>${n||""}</b><span>${i+1}</span></div>`).join("")}</div></div>`;
  return h+vRec().replace(/^[\s\S]*?<\/header>/,"");
}
function vExList(){ const ex=exStats(); if(!ex.length) return `<p class="lead" style="margin-top:16px">Sobald du Sätze abhakst, erscheinen hier deine Übungen mit Verlauf.</p>`;
  let g0="", h=""; ex.forEach(e=>{ if(e.g!==g0){ h+=`<div class="grp">${esc(e.g)}</div>`; g0=e.g; }
    const ws=Object.keys(e.weeks).map(Number).sort((a,b)=>a-b); const first=e.weeks[ws[0]].kg, last=e.weeks[ws[ws.length-1]].kg; const d=last-first;

function openExDetail(name){ const e=exStats().find(x=>x.name===name); if(!e) return; const ws=Object.keys(e.weeks).map(Number).sort((a,b)=>a-b);
  const vals=ws.map(w=>e.weeks[w].kg); const mn=Math.min(...vals), mx=Math.max(...vals); const Wd=340,Hd=150,px=34,py=14;

  g+=`<text x="${px}" y="${Hd-1}" fill="#8A8D94" font-size="10">W1</text><text x="${Wd-8}" y="${Hd-1}" fill="#8A8D94" font-size="10" text-anchor="end">W${NW}</text></svg>`;
  $("#sheet").innerHTML=`<div class="grab"></div><h3>${esc(name)}</h3><p>${esc(e.g)} · Bestwert ${fk(e.best)} kg · ${e.n} Sätze</p>${g}
   <div style="margin-top:8px">${ws.slice().reverse().map(w=>`<div class="row"><div class="l">Woche ${w}${W(w).deload?" · Deload":""}</div><div class="r"><b style="font-size:18px">${fk(e.weeks[w].kg)} kg</b><small>× ${esc(e.weeks[w].reps||"–")}</small></div></div>`).join("")}</div>
   <button class="btn" data-act="close">Schließen</button>`;
  $("#sheet").classList.add("show"); $("#sheetbg").classList.add("show"); }
function vHistory(){ const all=sessionsAll(); if(!all.length) return `<p class="lead" style="margin-top:16px">Abgeschlossene Einheiten erscheinen hier – antippen zum Ansehen.</p>`;
  let m0="", h=""; all.forEach(s=>{ const m=s.date?s.date.toLocaleDateString("de-DE",{month:"long",year:"numeric"}):"Ohne Datum"; if(m!==m0){ h+=`<div class="grp">${esc(m)}</div>`; m0=m; }

      <div class="r"><b class="${s.done?"gain":""}">${s.done?"✓":s.ok+"/"+s.all}</b></div></button>`; });

function openSessDetail(w,d){ const day=daysFor(w)[d]; const s=st.sess[w+"|"+d], dt=sessDate(w,d), fv=st.form[w+"|"+d];
  let h=`<div class="grab"></div><h3>${esc(day.pull?"Pull":day.split?"Push":day.tag)} · Woche ${w}</h3><p>${dt?dt.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"}):""}${s&&s.e?" · "+fmtDur(new Date(s.e)-new Date(s.s)):""}${fv?" · Form "+fv:""}</p>`;

    h+=`<div class="row"><div class="l">${esc(exName(sl,w))}<small>${esc(sl.art)}</small></div><div class="r" style="max-width:55%"><small style="font-size:13px;color:var(--silver)">${L.sets.filter(z=>z.ok).map(z=>(z.kg||"–")+" × "+(z.reps||"–")).join(" · ")}</small></div></div>`; });
  const nt=st.notes[w+"|"+d]; if(nt) h+=`<p style="margin-top:12px;color:var(--silver)">✎ ${esc(nt)}</p>`;
  h+=`<button class="btn gold" data-jump="${w}|${d}">Zur Einheit springen</button><button class="btn" data-act="close">Schließen</button>`;

/* ============ Timer ============ */
let tEnd=0,tTot=0,tInt=null,actx=null;
function beep(){ if(!st.set.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); [0,.28,.56].forEach(o=>{ const g=actx.createGain(), osc=actx.createOscillator(); osc.frequency.value=988; osc.type="sine"; g.gain.setValueAtTime(0.0001,actx.currentTime+o); g.gain.exponentialRampToValueAtTime(0.8,actx.currentTime+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+o+0.22); osc.connect(g).connect(actx.destination); osc.start(actx.currentTime+o); osc.stop(actx.currentTime+o+0.25); }); }catch(e){} }
function unlockAudio(){ try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){} try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function startTimer(sec,label){ if(!sec) return; tTot=sec; tEnd=Date.now()+sec*1000; $("#tlbl").textContent=label; $("#timer").classList.add("show"); $("#timer").classList.remove("end"); clearInterval(tInt); tInt=setInterval(tick,250); tick(); }
function tick(){ const r=Math.max(0,Math.round((tEnd-Date.now())/1000)); $("#tval").textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0"); $("#tbar").style.width=(100*(1-r/tTot))+"%";
  if(r<=0&&!$("#timer").classList.contains("end")){ $("#timer").classList.add("end"); $("#tlbl").textContent="Pause vorbei – nächster Satz"; beep(); setTimeout(beep,900); try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(e){}
    const f=$("#flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); } }
$("#tplus").onclick=()=>{ tEnd+=30000; tTot+=30; $("#timer").classList.remove("end"); };
$("#tstop").onclick=()=>{ clearInterval(tInt); $("#timer").classList.remove("show"); };

  if(t.dataset.exnote!==undefined){ const n=t.dataset.exnote; if(t.value.trim()) st.exnotes[n]=t.value; else delete st.exnotes[n]; save(); return; }
  if(t.dataset.body!==undefined){ st.body[t.dataset.body]=t.value; save(); return; }
  if(t.dataset.set){ const k=t.dataset.set; if(k==="start") st.set.start=t.value; else if(k==="name") st.set.name=t.value.trim(); else { const v=num(t.value); st.set[k]= (k.endsWith("2")||k.endsWith("3"))&&t.value.trim()===""?null:(v??st.set[k]); } save(); return; }
});
document.addEventListener("change",e=>{ const t=e.target;
  if(t.dataset.exnote!==undefined){ render(); }
  if(t.dataset.track!==undefined){ const arr=[...st.set.tracked]; arr[+t.dataset.track]=t.value; st.set.tracked=arr.filter(Boolean); save(); render(); }
  if(t.id==="impfile"&&t.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||!d.set||!d.log) throw 0; st=Object.assign(DEF(),d); st.set=Object.assign(DEF().set,d.set); save(); render(); toast("Sicherung importiert"); }catch(err){ toast("Datei ist keine Kraftwerk-Sicherung"); } }; fr.readAsText(t.files[0]); t.value=""; }
});
async function shareFile(name,text,type){
  const blob=new Blob([text],{type});
  try{ const file=new File([blob],name,{type}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function doCsv(){
  const rows=[["Woche","Tag","Pos","Übung","Satz","kg","Wdh","RIR","erledigt","Datum"]]; const recs=[];
  Object.keys(st.log).forEach(k=>{ const [w,d,sid]=k.split("|"); const slot=slotFor(+d,sid); if(!slot||exName(slot,+w)==null) return; const pos=posOf(+d,slot);
    const dt=st.dates[w+"|"+d]; const ds=dt?iso(new Date(dt)):"";
    st.log[k].sets.forEach((z,i)=>{ if(z.kg===""&&z.reps===""&&!z.ok) return; recs.push([+w,+d,pos,i+1,[w,TAGS[+d],pos,exName(slot,+w),i+1,z.kg,z.reps,z.rir,z.ok?"ja":"nein",ds]]); }); });
  recs.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]||a[3]-b[3]).forEach(r=>rows.push(r[4]));
  const csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
  shareFile("kraftwerk-training-"+iso(new Date())+".csv",csv,"text/csv");
}
async function doExport(){
  const name="kraftwerk-sicherung-"+iso(new Date())+".json"; const blob=new Blob([JSON.stringify(st)],{type:"application/json"});
  try{ const file=new File([blob],name,{type:"application/json"}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Kraftwerk-Sicherung"}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ============ Wischen zum Löschen ============ */
let swEl=null, swX=0, swY=0, swMoved=false, swBlock=0;
document.addEventListener("click",e=>{ if(Date.now()-swBlock<350&&!e.target.closest(".swdel")){ e.stopPropagation(); e.preventDefault(); } },true);
document.addEventListener("touchstart",e=>{ const el=e.target.closest("[data-sw]"); document.querySelectorAll(".swrap.open").forEach(o=>{ if(o!==el) o.classList.remove("open"); });
  if(!el||e.target.closest(".swdel")) { swEl=null; return; } swEl=el; swX=e.touches[0].clientX; swY=e.touches[0].clientY; swMoved=false; },{passive:true});
document.addEventListener("touchmove",e=>{ if(!swEl) return; const dx=e.touches[0].clientX-swX, dy=e.touches[0].clientY-swY;
  if(!swMoved&&Math.abs(dy)>Math.abs(dx)){ swEl=null; return; } if(Math.abs(dx)>8){ swMoved=true; const base=swEl.classList.contains("open")?-100:0;
  swEl.querySelector(".swin").style.transition="none"; swEl.querySelector(".swin").style.transform=`translateX(${Math.min(0,Math.max(-110,base+dx))}px)`; } },{passive:true});
document.addEventListener("touchend",e=>{ if(!swEl) return; const inner=swEl.querySelector(".swin"); inner.style.transition=""; inner.style.transform="";
  if(swMoved){ swBlock=Date.now(); const dx=e.changedTouches[0].clientX-swX; const open=swEl.classList.contains("open"); swEl.classList.toggle("open", open? dx<40 : dx<-50); } swEl=null; });
/* ============ Start ============ */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
(function(){ const h=new Date().getHours(); const g=h<11?"Guten Morgen":h<17?"Hallo":h<22?"Guten Abend":"Späte Einheit";
  const nm=(st.set.name||"").trim(); const sg=$("#spg"); if(sg) sg.textContent=g+(nm?", "+nm:"")+".";
  const sd=$("#spd"); if(sd&&st.onboarded) sd.textContent="Woche "+ui.w+" · "+DAYS[ui.d].tag+(W(ui.w).deload?" · Deload":"");
  const sp=$("#splash"); if(sp) sp.addEventListener("click",()=>sp.remove()); })();
(function(){ const el=$("#spw"); if(el) el.innerHTML="KRAFTWERK".split("").map((c,i)=>`<span style="animation-delay:${i*45}ms">${c}</span>`).join("");
  setTimeout(()=>{ const s=$("#splash"); if(s) s.remove(); },3400); })();
render(); wake();
